
<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oktatási válaszgyűjtő</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    main {
      max-width: 600px;
      margin: 50px auto;
      padding: 32px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 16px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    form {
      display: grid;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #0078d4;
      outline-offset: 1px;
    }

    .field-description {
      margin: -5px 0 5px;
      color: #666;
      font-size: 13px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 5px;
      background: #0078d4;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result {
      margin-top: 24px;
      padding: 20px;
      background: #f1f7f7;
      border-left: 4px solid #00a3a3;
      border-radius: 5px;
    }

    .result[hidden] {
      display: none;
    }

    .link-container {
      margin-top: 16px;
      overflow-wrap: anywhere;
      padding: 12px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    .copy-button {
      margin-top: 12px;
      background: #008577;
    }

    #status {
      line-height: 1.5;
    }

  </style>
</head>

<body>
  <main>

    <h1>Oktatási válaszgyűjtő</h1>
    <p>Tanári felület</p>

    <form id="session-form">

      <label for="session-name">
        A munkamenet neve
      </label>

      <input
        id="session-name"
        name="session-name"
        type="text"
        placeholder="Például: Béla"
        required
      >

      <label for="max-participants">
        Résztvevők maximális száma
      </label>

      <input
        id="max-participants"
        name="max-participants"
        type="number"
        min="1"
        max="40"
        step="1"
        value="40"
        required
      >

      <p class="field-description">
        Minimum 1, maximum 40 fő.
      </p>

      <button id="submit-button" type="submit">
        Menet indítása
      </button>

    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <!-- Sikeres munkamenet után megjelenő eredmény -->

    <section id="result" class="result" hidden>

      <h2>Munkamenet létrejött</h2>

      <p>
        <strong>Munkamenet neve:</strong>
        <strong id="result-name"></strong>
      </p>

      <p>
        <strong>Azonosító:</strong>
        <span id="result-id"></span>
      </p>

      <p>
        <strong>Maximális résztvevőszám:</strong>
        <span id="result-limit"></span> fő
      </p>

      <h3>Résztvevői hivatkozás</h3>

      <div class="link-container">
        <a
          id="form-link"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          Form megnyitása
        </a>
      </div>

      <button
        type="button"
        id="copy-button"
        class="copy-button"
      >
        Hivatkozás másolása
      </button>

      <p id="copy-status" aria-live="polite"></p>

    </section>

  </main>

  <script>

    // ==========================================
    // 1. HTML ELEMEK
    // ==========================================

    const form = document.getElementById("session-form");

    const nameInput =
      document.getElementById("session-name");

    const limitInput =
      document.getElementById("max-participants");

    const status =
      document.getElementById("status");

    const submitButton =
      document.getElementById("submit-button");

    const resultSection =
      document.getElementById("result");

    const resultName =
      document.getElementById("result-name");

    const resultId =
      document.getElementById("result-id");

    const resultLimit =
      document.getElementById("result-limit");

    const formLink =
      document.getElementById("form-link");

    const copyButton =
      document.getElementById("copy-button");

    const copyStatus =
      document.getElementById("copy-status");


    // ==========================================
    // 2. POWER AUTOMATE KAPCSOLAT
    // ==========================================

    const FLOW_URL =
      "https://default003fcf5734804f89ac3a530d8d046c.be.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/31/workflows/4f070c0cbcef4f7c9cf60db3ca947fc5/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=H5y0K4xy46XtHGPM8gdGuGEFhuei-MVyaMBVpU_U4Zg";


    // ==========================================
    // 3. RÉSZTVEVŐI OLDAL URL-JE
    // ==========================================

    const FORM_URL =
      new URL("./form.html", window.location.href).href;


    let currentFormUrl = "";


    // ==========================================
    // 4. LÉTSZÁM ELLENŐRZÉSE
    // ==========================================

    function validateParticipantLimit() {

      const maxParticipants = limitInput.valueAsNumber;

      if (
        !Number.isInteger(maxParticipants) ||
        maxParticipants < 1 ||
        maxParticipants > 40
      ) {

        status.textContent =
          "A résztvevők száma 1 és 40 közötti egész szám lehet.";

        limitInput.focus();

        return null;
      }

      return maxParticipants;
    }


    // ==========================================
    // 5. MUNKAMENET LÉTREHOZÁSA
    // ==========================================

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const sessionName = nameInput.value.trim();

      if (!sessionName) {

        status.textContent =
          "Kérlek, add meg a munkamenet nevét!";

        nameInput.focus();

        return;
      }


      // Létszám ellenőrzése

      const maxParticipants =
        validateParticipantLimit();

      if (maxParticipants === null) {
        return;
      }


      if (!FLOW_URL) {

        status.textContent =
          "A Power Automate adatkapcsolat még nincs beállítva.";

        return;
      }


      submitButton.disabled = true;

      resultSection.hidden = true;

      copyStatus.textContent = "";

      status.textContent =
        "Munkamenet létrehozása folyamatban...";


      try {

        const response = await fetch(FLOW_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            sessionName: sessionName,

            maxParticipants: maxParticipants

          })

        });


        const result = await response.json();


        if (!response.ok) {

          throw new Error(
            `HTTP-hiba: ${response.status}`
          );

        }


        if (
          result.success !== true ||
          !result.sessionId
        ) {

          throw new Error(
            result.message ||
            "Nem érkezett vissza munkamenet-azonosító."
          );

        }


        // ======================================
        // 6. MUNKAMENET ADATAINAK MEGJELENÍTÉSE
        // ======================================

        resultName.textContent =
          result.sessionName || sessionName;

        resultId.textContent =
          result.sessionId;

        resultLimit.textContent =
          maxParticipants;


        // ======================================
        // 7. RÉSZTVEVŐI HIVATKOZÁS ELŐÁLLÍTÁSA
        // ======================================

        const url = new URL(FORM_URL);

        url.searchParams.set(
          "sessionId",
          result.sessionId
        );

        currentFormUrl = url.href;

        formLink.href = currentFormUrl;

        formLink.textContent = currentFormUrl;


        resultSection.hidden = false;

        status.textContent =
          "A munkamenet sikeresen létrejött!";


      } catch (error) {

        console.error(
          "Munkamenet létrehozási hiba:",
          error
        );

        status.textContent =
          "Nem sikerült befejezni a kérést. " +
          "Ellenőrizd a Power Automate futási előzményeit " +
          "és a böngésző konzolját.";

      } finally {

        submitButton.disabled = false;

      }

    });


    // ==========================================
    // 8. RÉSZTVEVŐI HIVATKOZÁS MÁSOLÁSA
    // ==========================================

    copyButton.addEventListener("click", async () => {

      if (!currentFormUrl) return;

      try {

        await navigator.clipboard.writeText(
          currentFormUrl
        );

        copyStatus.textContent =
          "A hivatkozás sikeresen másolva!";

      } catch (error) {

        copyStatus.textContent =
          "A másolás nem sikerült. " +
          "Jelöld ki és másold ki a hivatkozást.";

      }

    });

  </script>

</body>
</html>
